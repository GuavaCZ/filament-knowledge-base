name: Release

on:
  push:
    branches:
      - main
      - '*.x'
      - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # RELEASE_PLEASE_TOKEN (a fine-grained PAT) is preferred: PRs created
          # with the default GITHUB_TOKEN don't trigger the test workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
