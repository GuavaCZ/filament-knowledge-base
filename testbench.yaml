laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\AdminPanelProvider
  - Workbench\App\Providers\KnowledgeBasePanelProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    config: false
    factories: true
    web: true
    api: false
    commands: false
    components: false
    views: true
  build:
    - asset-publish
    - filament-assets
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync: []
